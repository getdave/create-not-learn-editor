<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create Not Learn banner</title>
<style>
	/*
	 * Mainstay's palette, type and arched photos, so the listing looks like
	 * the sites the editor makes.
	 */
	@font-face {
		font-family: "Bricolage Grotesque";
		src: url("../../themes/mainstay/assets/fonts/bricolage-grotesque.woff2") format("woff2");
		font-weight: 200 800;
	}

	:root {
		--base: #fbfbf8;
		--contrast: #15241c;
		--accent-1: #2e6b4f;
		--accent-2: #f2c14e;
		--accent-3: #e4ddf4;
		--base-2: #edf1ea;
		--contrast-2: #4b5b52;
	}

	* {
		box-sizing: border-box;
		margin: 0;
	}

	/* Drawn at 772x250 and scaled up for the 2x banner. */
	body {
		position: relative;
		width: 772px;
		height: 250px;
		overflow: hidden;
		background: var(--base-2);
		color: var(--contrast);
		font-family: "Bricolage Grotesque", sans-serif;
		letter-spacing: -0.005em;
	}

	.intro {
		position: absolute;
		top: 46px;
		left: 44px;
		width: 390px;
	}

	.brand {
		display: flex;
		gap: 10px;
		align-items: center;
		font-size: 15px;
		font-weight: 700;
	}

	.brand img {
		width: 28px;
		height: 28px;
		border-radius: 7px;
	}

	h1 {
		margin-top: 22px;
		font-size: 36px;
		font-weight: 700;
		letter-spacing: -0.025em;
		line-height: 1.05;
	}

	.intro p {
		margin-top: 12px;
		color: var(--contrast-2);
		font-size: 16px;
		line-height: 1.4;
	}

	/* The sun behind the page. */
	.sun {
		position: absolute;
		top: -70px;
		left: 600px;
		width: 220px;
		height: 220px;
		border-radius: 50%;
		background: var(--accent-2);
	}

	/* A Fernhouse page, running off the bottom edge. */
	.page {
		position: absolute;
		top: 34px;
		left: 442px;
		width: 300px;
		height: 260px;
		padding: 12px 16px;
		border-radius: 14px;
		background: var(--base);
		box-shadow: 0 18px 40px rgba(21, 36, 28, 0.16);
		transform: rotate(-3deg);
	}

	.page-header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		font-size: 9px;
		font-weight: 700;
	}

	.page-header nav {
		display: flex;
		gap: 8px;
		align-items: center;
		font-weight: 500;
	}

	.pill {
		padding: 3px 8px;
		border-radius: 999px;
		background: var(--accent-1);
		color: var(--base);
		font-weight: 600;
	}

	.hero {
		display: flex;
		gap: 12px;
		margin-top: 16px;
	}

	.hero h2 {
		flex: 1;
		font-size: 21px;
		font-weight: 700;
		letter-spacing: -0.025em;
		line-height: 1.02;
	}

	.arch {
		flex: none;
		width: 92px;
		height: 104px;
		border-radius: 46px 46px 0 0;
		background: url("../../themes/mainstay/assets/images/glasshouse.webp") center / cover;
	}

	/* Where the lifted section came from. */
	.slot {
		height: 64px;
		margin-top: 10px;
		border: 2px dashed #b9c4b6;
		border-radius: 10px;
	}

	/* The section being dropped into place. */
	.section {
		position: absolute;
		top: 164px;
		left: 478px;
		display: flex;
		gap: 12px;
		align-items: center;
		width: 284px;
		height: 72px;
		padding: 10px 14px 10px 10px;
		border-radius: 12px;
		background: var(--accent-1);
		color: var(--base);
		box-shadow: 0 20px 36px rgba(21, 36, 28, 0.28);
		transform: rotate(2deg);
	}

	.section .photo {
		flex: none;
		width: 64px;
		height: 52px;
		border-radius: 8px;
		background: url("../../themes/mainstay/assets/images/hands-in-soil.webp") center 30% / cover;
	}

	.section h3 {
		font-size: 14px;
		font-weight: 700;
		letter-spacing: -0.02em;
		line-height: 1.1;
	}

	.section .button {
		display: inline-block;
		margin-top: 6px;
		padding: 3px 9px;
		border-radius: 999px;
		background: var(--accent-2);
		color: var(--contrast);
		font-size: 9px;
		font-weight: 600;
	}
</style>
</head>
<body>
	<div class="intro">
		<div class="brand">
			<img src="../../.wordpress-org/icon.svg" alt="">
			Create Not Learn
		</div>
		<h1>Make your website,<br>skip the learning curve.</h1>
		<p>A friendly site editor for WordPress.</p>
	</div>

	<div class="sun" aria-hidden="true"></div>

	<div class="page" aria-hidden="true">
		<div class="page-header">
			Fernhouse
			<nav>About <span>Café</span> <span class="pill">Get in touch</span></nav>
		</div>
		<div class="hero">
			<h2>Plants, coffee and a slower Saturday.</h2>
			<div class="arch"></div>
		</div>
		<div class="slot"></div>
	</div>

	<div class="section" aria-hidden="true">
		<div class="photo"></div>
		<div>
			<h3>Weekend potting workshops</h3>
			<span class="button">Book a place</span>
		</div>
	</div>
</body>
</html>
