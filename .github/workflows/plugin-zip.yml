name: Plugin zip

# Builds an installable plugin zip on every push and attaches it to the
# workflow run as an artifact.
#
# It also publishes a WordPress Playground demo of the push. The zip, the
# Mainstay theme, the demo site seed script and the Playground canvas fix go on
# a ref of their own, which the demo's blueprint installs from.
#
# - trunk goes to the `playground-build` branch, which `demos/blueprint.json`
#   installs from. That keeps the README's demo on the latest trunk.
# - Any other branch goes to `refs/playground/<branch>`, with a blueprint of
#   its own, so work in progress can be tried before it merges. The ref is
#   neither a branch nor a tag, so it stays out of both lists, but
#   raw.githubusercontent.com serves from it all the same.
#   `.github/workflows/playground-links.yml` links it from the branch's pull
#   request and deletes it with the branch.
# - A `v*` tag, such as `v0.2.0`, goes to a `playground-v0.2.0` tag, with a
#   blueprint that also pins WordPress to the version wp-env runs. The demo
#   stays the same while trunk moves on, for user tests. The GitHub release
#   for the tag links to it.
#
# `scripts/playground-build.sh` puts the files together.

on:
  push:
    branches:
      - '**'
      - '!playground-build'
    tags:
      - 'v*'
  workflow_dispatch:

# One build at a time for each ref. A newer push cancels the build in progress,
# but a release always finishes.
concurrency:
  group: plugin-zip-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Write access is only for publishing the Playground build and the release.
permissions:
  contents: write

env:
  ZIP_NAME: create-not-learn-editor.zip
  # trunk, branch or release. Empty for any other tag, which isn't published.
  PLAYGROUND_KIND: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.ref == 'refs/heads/trunk' && 'trunk' || startsWith(github.ref, 'refs/heads/') && 'branch' || '' }}
  # The ref the Playground build is published to.
  PLAYGROUND_REF: ${{ startsWith(github.ref, 'refs/tags/v') && format('refs/tags/playground-{0}', github.ref_name) || github.ref == 'refs/heads/trunk' && 'refs/heads/playground-build' || format('refs/playground/{0}', github.ref_name) }}

jobs:
  build:
    name: Build plugin zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Check zip contents
        run: |
          unzip -l "$ZIP_NAME" > zip-contents.txt
          for path in \
            create-not-learn-editor/create-not-learn-editor.php \
            create-not-learn-editor/build/pages.php \
            create-not-learn-editor/build/routes.php; do
            grep -q " $path$" zip-contents.txt || { echo "::error::Missing $path in $ZIP_NAME"; exit 1; }
          done

      # Uploaded as-is rather than wrapped in a second zip, so the download
      # installs directly via Plugins > Add New > Upload Plugin.
      - name: Upload plugin zip
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_NAME }}
          archive: false
          if-no-files-found: error

      - name: Add download link to summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "Download [${ZIP_NAME}](${ARTIFACT_URL}) built from \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"

      # Playground can't install from workflow artifacts or release assets,
      # which don't allow cross-origin downloads, but it can fetch from
      # raw.githubusercontent.com. So the files the blueprint needs go on a
      # ref of their own, holding a single commit. A branch's ref is replaced
      # on every push, so old zips don't pile up in the history. A release
      # gets a tag that stays put.
      - name: Publish Playground build
        if: env.PLAYGROUND_KIND != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/playground-build.sh "$PLAYGROUND_KIND" "$GITHUB_REF_NAME" "$PLAYGROUND_REF" playground-build
          cd playground-build
          git init -q -b playground-build
          git add .
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Playground build of ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          # Forced so a re-run, or a release tag moved to a new commit,
          # replaces the build rather than failing.
          git push --force -q \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:$PLAYGROUND_REF"

          if [ "$PLAYGROUND_KIND" = trunk ]; then
            blueprint_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/trunk/demos/blueprint.json"
          else
            blueprint_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PLAYGROUND_REF}/blueprint.json"
          fi
          echo "PLAYGROUND_URL=https://playground.wordpress.net/?blueprint-url=${blueprint_url}" >> "$GITHUB_ENV"
          echo "[Try this build in WordPress Playground](https://playground.wordpress.net/?blueprint-url=${blueprint_url})." >> "$GITHUB_STEP_SUMMARY"

      # Leads the release notes with the Playground link and attaches the zip.
      # Works whether the release was made here or by hand before the tag was
      # pushed.
      - name: Publish GitHub release
        if: env.PLAYGROUND_KIND == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          link="[Try ${GITHUB_REF_NAME} in WordPress Playground](${PLAYGROUND_URL}). It stays on this release while trunk moves on."

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
            if ! grep -qF "$PLAYGROUND_URL" <<< "$body"; then
              printf '%s\n\n%s\n' "$link" "$body" > release-notes.md
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            fi
            gh release upload "$GITHUB_REF_NAME" "$ZIP_NAME" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "$link" \
              --generate-notes
          fi
