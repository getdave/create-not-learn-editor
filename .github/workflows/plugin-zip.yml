name: Plugin zip

# Builds an installable plugin zip on every push to trunk and attaches it to
# the workflow run as an artifact.
#
# It also publishes the zip, the Mainstay theme and the demo site seed script
# to the `playground-build` branch, which `demos/blueprint.json` installs
# from. That is what keeps the README's Playground demo on the latest trunk.

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

# Only one build at a time. A newer push to trunk cancels the build in progress.
concurrency:
  group: plugin-zip-trunk
  cancel-in-progress: true

# Write access is only for pushing the `playground-build` branch.
permissions:
  contents: write

env:
  ZIP_NAME: create-not-learn-editor.zip
  PLAYGROUND_BRANCH: playground-build

jobs:
  build:
    name: Build plugin zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Check zip contents
        run: |
          unzip -l "$ZIP_NAME" > zip-contents.txt
          for path in \
            create-not-learn-editor/create-not-learn-editor.php \
            create-not-learn-editor/build/pages.php \
            create-not-learn-editor/build/routes.php; do
            grep -q " $path$" zip-contents.txt || { echo "::error::Missing $path in $ZIP_NAME"; exit 1; }
          done

      # Uploaded as-is rather than wrapped in a second zip, so the download
      # installs directly via Plugins > Add New > Upload Plugin.
      - name: Upload plugin zip
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_NAME }}
          archive: false
          if-no-files-found: error

      - name: Add download link to summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "Download [${ZIP_NAME}](${ARTIFACT_URL}) built from \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"

      # Playground can't install from workflow artifacts or release assets,
      # which don't allow cross-origin downloads, but it can fetch from
      # raw.githubusercontent.com. So the files the blueprint needs go on a
      # branch of their own. It holds a single commit, replaced on every
      # build, so old zips don't pile up in the history.
      - name: Publish Playground build
        if: github.ref == 'refs/heads/trunk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir playground-build
          cp "$ZIP_NAME" scripts/demo-site/seed.php playground-build/
          (cd themes && zip -qr ../playground-build/mainstay.zip mainstay)
          cat > playground-build/README.md <<EOF
          # Playground build

          Generated from [\`${GITHUB_SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) by \`.github/workflows/plugin-zip.yml\`. Do not edit or commit to this branch, it is replaced on every push to trunk.

          These are the files [\`demos/blueprint.json\`](https://github.com/${GITHUB_REPOSITORY}/blob/trunk/demos/blueprint.json) installs.
          EOF
          cd playground-build
          git init -q -b "$PLAYGROUND_BRANCH"
          git add .
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Playground build of ${GITHUB_SHA::7}"
          git push --force -q \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$PLAYGROUND_BRANCH"
